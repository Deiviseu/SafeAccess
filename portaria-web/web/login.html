<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; connect-src 'self' https://*.supabase.co wss://*.supabase.co; object-src 'none'; base-uri 'self'; form-action 'self'">
<meta name="referrer" content="no-referrer">
<title>Entrar · SafeAccess Sacchelli</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body class="pagina-login" data-page="login">
<main>
  <form class="card login" id="form" novalidate>
    <div id="marca"></div>
    <div><h1>Entrar</h1><p class="muted">Acesso restrito aos operadores da portaria.</p></div>
    <label>E-mail<input name="email" id="email" type="email" autocomplete="username" required></label>
    <label>Senha<input name="senha" type="password" autocomplete="current-password" required></label>
    <p id="msg" class="msg" role="alert"></p>
    <button class="btn btn-primary btn-block" id="entrar" type="submit">Entrar</button>
    <p class="muted">Esqueceu a senha? Procure o administrador do sistema.</p>
  </form>
</main>
<script src="vendor/supabase.js"></script>
<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/comum.js"></script>
<script src="js/login.js"></script>
</body>
</html>
